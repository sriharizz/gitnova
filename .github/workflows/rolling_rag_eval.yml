name: GitNova Rolling RAG Evaluation

on:
  schedule:
    # Run every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Allows manual evaluation runs from GitHub UI

jobs:
  run-evaluation:
    name: Run Rolling RAG Benchmark Against Merged PR Ground Truth
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-pipeline.txt ]; then
            pip install -r backend/requirements-pipeline.txt
          else
            pip install -r backend/requirements.txt
          fi

      - name: Run Rolling RAG Evaluation
        run: |
          cd backend
          python -m app.pipeline.run_rolling_rag_eval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Upload Evaluation Dataset Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-rag-eval-dataset
          path: backend/data/rolling_rag_eval_dataset.json
          if-no-files-found: ignore
