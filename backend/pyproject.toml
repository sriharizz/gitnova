[tool.poetry]
name = "gitnova"
version = "4.2.0"
description = "AI Open Source Mentor — finds your first successful contribution with confidence"
authors = ["sriharizz"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
asyncpg = "^0.29.0"
httpx = "^0.27.0"
litellm = "^1.40.0"
python-dotenv = "^1.0.0"
python-json-logger = "^2.0.7"
sentence-transformers = "^3.0.0"
transformers = "<5.0.0"
torch = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
httpx = "^0.27.0"
pip-audit = "^2.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

